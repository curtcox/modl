name: Deploy MODL
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/test-browser.yml
  deploy:
    needs: test
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/pages.yml@v2
    with:
      stage-command: npm ci && node scripts/stage.mjs
      path: _site
      verify-marker: modl-fragment-kit-v0.3.5
