name: Test MODL
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/test.yml@v2
    with:
      kit-path: vendor/fragment-kit-v0.3.4
      contract-config: testing-contract.config.mjs
      base-url: http://127.0.0.1:8012/
      server-command: node vendor/fragment-kit-v0.3.4/tools/serve.mjs --port 8012
      browser-command: node tests/browser/deep-zoom.cjs "$FRAGMENT_KIT_BASE_URL" "$BROWSER" && npx playwright test --project="$BROWSER"
      gallery-command: node scripts/render-kit-gallery.mjs --check
  kit:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/kit-check.yml@v2
    with:
      kit-path: vendor/fragment-kit-v0.3.4
